name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  shell-check:
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master

  # Rather than setup ruby several times, we run rubocop and mdl in
  # the same place, until the actionshub mdl checker is working again
  ruby-linters:
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'
    - name: install deps
      run: bundle install
    - name: Run rubocop
      run: ./scripts/run_rubocop.sh
    - name: Run mdl
      run: ./scripts/run_mdl.sh
  #markdownlint:
  #  permissions:
  #    contents: read
  #    pull-requests: read
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Harden the runner (Audit all outbound calls)
  #      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
  #      with:
  #        egress-policy: audit

  #    - name: checkout
  #      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #    - name: MarkdownLint mdl Action
  #      uses: actionshub/markdownlint@6c82ff529253530dfbf75c37570876c52692835f # 3.1.4
  linelint:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    name: Check if all files end in newline
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linelint
        uses: fernandrone/linelint@7907a5dca0c28ea7dd05c6d8d8cacded713aca11 # master
        id: linelint
