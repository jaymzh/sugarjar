name: DCO Check
on: [pull_request]

permissions: {}

jobs:
  dco_check_job:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    name: DCO Check
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Get PR Commits
      uses: actionshub/get-pr-commits@043233955440a262985aee5a35e69da1fcbfb9e7 # main
      id: 'get-pr-commits'
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: DCO Check
      uses: actionshub/dco@96f73417c212ef19e4934a3089c60685fe5d3b19 # main
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
